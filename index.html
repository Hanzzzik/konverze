<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Convertor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-black text-gray-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto py-12 px-6">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-black tracking-tighter bg-gradient-to-br from-white to-gray-500 bg-clip-text text-transparent">
                ULTRA CONVERT
            </h1>
            <p class="text-gray-500 mt-2 text-sm uppercase tracking-widest">Obrázky • Dokumenty • PDF</p>
        </header>

        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-2xl">
            <div class="flex flex-wrap gap-4 mb-8">
                <div class="flex-1 min-w-[200px]">
                    <label class="text-xs font-bold text-zinc-500 mb-2 block uppercase">Cílová operace</label>
                    <select id="mode" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                        <option value="webp">Konvertovat na WebP (Web)</option>
                        <option value="jpg">Konvertovat na JPEG (Foto)</option>
                        <option value="png">Konvertovat na PNG (Kvalita)</option>
                        <option value="pdf">Vytvořit PDF dokument</option>
                    </select>
                </div>
            </div>

            <div id="dropZone" class="group border-2 border-dashed border-zinc-800 hover:border-blue-500 hover:bg-blue-500/5 rounded-2xl p-16 text-center transition-all cursor-pointer">
                <div class="text-4xl mb-4 group-hover:scale-110 transition-transform">⚡</div>
                <p class="text-zinc-400 font-medium">Přetáhněte soubory sem nebo <span class="text-white">vyberte z disku</span></p>
                <input type="file" id="fileInput" multiple class="hidden">
            </div>

            <div id="resultList" class="mt-8 grid gap-3"></div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const mode = document.getElementById('mode');
        const resultList = document.getElementById('resultList');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => processFiles(Array.from(e.target.files));

        async function processFiles(files) {
            if (mode.value === 'pdf') {
                await createPDF(files);
            } else {
                files.forEach(convertImage);
            }
        }

        function convertImage(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const type = `image/${mode.value === 'jpg' ? 'jpeg' : mode.value}`;
                    const url = canvas.toDataURL(type, 0.9);
                    addResult(file.name.split('.')[0] + '.' + (mode.value === 'jpg' ? 'jpg' : mode.value), url);
                };
            };
        }

        async function createPDF(files) {
            const doc = new jsPDF();
            for (let i = 0; i < files.length; i++) {
                const data = await readFileAsDataURL(files[i]);
                if (i > 0) doc.addPage();
                doc.addImage(data, 'JPEG', 10, 10, 190, 0);
            }
            const blob = doc.output('bloburl');
            addResult('dokument_export.pdf', blob);
        }

        function readFileAsDataURL(file) {
            return new Promise(resolve => {
                const r = new FileReader();
                r.onload = (e) => resolve(e.target.result);
                r.readAsDataURL(file);
            });
        }

        function addResult(name, url) {
            const item = document.createElement('div');
            item.className = "flex items-center justify-between p-4 bg-zinc-800/50 rounded-xl border border-zinc-800 animate-in fade-in slide-in-from-bottom-2";
            item.innerHTML = `
                <span class="text-sm font-medium truncate pr-4">${name}</span>
                <a href="${url}" download="${name}" class="bg-white text-black px-5 py-2 rounded-lg text-sm font-bold hover:bg-gray-200 transition-colors">Stáhnout</a>
            `;
            resultList.prepend(item);
        }
    </script>
</body>
</html>
