<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraTool | PDF & Image Convertor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto py-12 px-6">
        <header class="text-center mb-10">
            <h1 class="text-6xl font-black bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">ULTRATOOL</h1>
            <p class="text-slate-500 mt-3 font-mono tracking-tighter text-sm uppercase">Images • PDF Merge • Document Pro</p>
        </header>

        <div class="bg-slate-900 border border-slate-800 p-8 rounded-[2rem] shadow-2xl">
            <div class="mb-8">
                <label class="text-xs font-bold text-slate-500 mb-2 block uppercase tracking-widest">Vyberte nástroj</label>
                <select id="mode" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-cyan-500 transition-all text-lg font-semibold">
                    <optgroup label="PDF Nástroje">
                        <option value="merge-pdf">➕ Spojit více PDF do jednoho</option>
                        <option value="img-to-pdf">📄 Obrázky do PDF</option>
                    </optgroup>
                    <optgroup label="Konverze Obrázků">
                        <option value="webp">Obrázek na WebP</option>
                        <option value="jpg">Obrázek na JPEG</option>
                        <option value="png">Obrázek na PNG</option>
                    </optgroup>
                </select>
            </div>

            <div id="dropZone" class="group border-2 border-dashed border-slate-800 hover:border-cyan-500 hover:bg-cyan-500/5 rounded-[1.5rem] p-20 text-center transition-all cursor-pointer relative overflow-hidden">
                <div class="text-5xl mb-4 group-hover:scale-125 transition-transform duration-300">📦</div>
                <p class="text-slate-400 text-lg">Hoďte soubory sem nebo <span class="text-cyan-400">procházejte</span></p>
                <input type="file" id="fileInput" multiple class="hidden">
            </div>

            <div id="status" class="hidden mt-4 text-center text-cyan-400 font-bold animate-pulse">Zpracovávám...</div>
            <div id="resultList" class="mt-8 space-y-3"></div>
        </div>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const mode = document.getElementById('mode');
        const resultList = document.getElementById('resultList');
        const status = document.getElementById('status');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleProcessing(Array.from(e.target.files));

        async function handleProcessing(files) {
            if (files.length === 0) return;
            status.classList.remove('hidden');
            
            try {
                if (mode.value === 'merge-pdf') {
                    await mergePDFs(files);
                } else if (mode.value === 'img-to-pdf') {
                    await imagesToPDF(files);
                } else {
                    files.forEach(convertImage);
                }
            } catch (err) {
                alert('Chyba při zpracování: ' + err.message);
            }
            status.classList.add('hidden');
        }

        async function mergePDFs(files) {
            const mergedPdf = await PDFDocument.create();
            for (const file of files) {
                if (file.type !== 'application/pdf') continue;
                const pdfBytes = await file.arrayBuffer();
                const pdf = await PDFDocument.load(pdfBytes);
                const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }
            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            addResult('spojeno.pdf', URL.createObjectURL(blob));
        }

        async function imagesToPDF(files) {
            const pdfDoc = await PDFDocument.create();
            for (const file of files) {
                const imgBytes = await file.arrayBuffer();
                let img;
                if (file.type === 'image/jpeg' || file.type === 'image/jpg') img = await pdfDoc.embedJpg(imgBytes);
                else if (file.type === 'image/png') img = await pdfDoc.embedPng(imgBytes);
                else continue;

                const page = pdfDoc.addPage([img.width, img.height]);
                page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
            }
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            addResult('obrazky.pdf', URL.createObjectURL(blob));
        }

        function convertImage(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const type = `image/${mode.value === 'jpg' ? 'jpeg' : mode.value}`;
                    addResult(file.name.split('.')[0] + '.' + (mode.value === 'jpg' ? 'jpg' : mode.value), canvas.toDataURL(type, 0.9));
                };
            };
        }

        function addResult(name, url) {
            const item = document.createElement('div');
            item.className = "flex items-center justify-between p-5 bg-slate-800/50 rounded-2xl border border-slate-700 animate-in fade-in zoom-in";
            item.innerHTML = `<span class="text-sm font-medium truncate pr-4">${name}</span>
                <a href="${url}" download="${name}" class="bg-cyan-500 text-slate-950 px-6 py-2 rounded-xl text-sm font-black hover:bg-cyan-400 transition-all">STÁHNOUT</a>`;
            resultList.prepend(item);
        }
    </script>
</body>
</html>
