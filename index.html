<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Konvertor Obrázků | Zdarma & Rychle</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-gray-800 p-8 rounded-3xl shadow-2xl border border-gray-700">
        <h1 class="text-4xl font-extrabold text-center bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent mb-4">
            Profi Image Tool
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-400">Cílový formát:</label>
                <select id="format" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="image/webp">WebP (Nejlepší pro web)</option>
                    <option value="image/jpeg">JPEG (Klasika)</option>
                    <option value="image/png">PNG (Bez ztráty kvality)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-400">Kvalita: <span id="qualVal">80</span>%</label>
                <input type="range" id="quality" min="1" max="100" value="80" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
        </div>

        <div id="dropZone" class="border-4 border-dashed border-gray-600 rounded-2xl p-12 text-center hover:border-blue-500 transition-all cursor-pointer group">
            <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">📸</div>
            <p class="text-xl font-semibold">Hoďte sem fotky nebo klikněte</p>
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
        </div>

        <div id="resultList" class="mt-8 space-y-3"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const qualitySlider = document.getElementById('quality');
        const qualVal = document.getElementById('qualVal');

        qualitySlider.oninput = () => qualVal.innerText = qualitySlider.value;
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFiles(e.target.files);

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        
                        const format = document.getElementById('format').value;
                        const quality = qualitySlider.value / 100;
                        const newUrl = canvas.toDataURL(format, quality);
                        
                        const ext = format.split('/')[1];
                        displayResult(file.name.split('.')[0] + '.' + ext, newUrl);
                    };
                };
            });
        }

        function displayResult(name, url) {
            const div = document.createElement('div');
            div.className = "flex items-center justify-between p-4 bg-gray-700 rounded-xl border border-gray-600 animate-fade-in";
            div.innerHTML = `
                <span class="text-sm truncate mr-4">${name}</span>
                <a href="${url}" download="${name}" class="bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-2 rounded-lg font-bold hover:from-blue-600 hover:to-blue-700 shadow-lg transition">Stáhnout</a>
            `;
            document.getElementById('resultList').prepend(div);
        }
    </script>
</body>
</html>
